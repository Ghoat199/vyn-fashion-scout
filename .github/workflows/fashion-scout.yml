name: Fashion Snipe
on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram test message"
        type: boolean
        default: false
  schedule:
    # One daily run keeps the one-time Scavio starter credits under control.
    - cron: "0 7 * * *"
permissions:
  contents: read
concurrency:
  group: fashion-snipe-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore seen-offer state
        uses: actions/cache/restore@v4
        with:
          path: seen_offers.json
          key: fashion-snipe-seen-${{ github.run_id }}
          restore-keys: fashion-snipe-seen-
      - name: Search Vinted and Kleinanzeigen or test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APISH_API_KEY: ${{ secrets.APISH_API_KEY }}
          SCAVIO_API_KEY: ${{ secrets.SCAVIO_API_KEY }}
          MAX_TOTAL_COST_EUR: "40"
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '0' }}
        run: python fashion_scout.py
      - name: Save seen-offer state
        if: success() && hashFiles('seen_offers.json') != ''
        uses: actions/cache/save@v4
        with:
          path: seen_offers.json
          key: fashion-snipe-seen-${{ github.run_id }}
